# .github/workflows/build.yml
name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # `npm run build` is the whole gate: lint, format, docs, typecheck, and
      # the production bundle. A red step here is a red build.
      - name: Install and build
        run: |
          npm ci
          npm run build

      # The finished site, ready to upload to the host. Deployment to AWS is
      # done outside this workflow; this artifact is what gets deployed.
      - name: Upload the built site
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error
